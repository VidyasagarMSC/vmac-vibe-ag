name: Bi-Weekly Content Update

on:
  schedule:
    # Runs every Monday and Thursday at midnight UTC
    - cron: '0 0 * * 1'
    - cron: '0 0 * * 4'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install XML parser
        run: npm install --no-save fast-xml-parser

      - name: Fetch articles from Dev.to API
        id: fetch-devto
        run: |
          echo "Fetching articles from Dev.to..."
          curl -s "https://dev.to/api/articles?username=vidyasagarmsc&per_page=10" \
            -H "Accept: application/json" \
            -o devto_articles.json || echo "[]" > devto_articles.json
          echo "Dev.to fetch complete."

      - name: Fetch RSS feeds from all platforms
        run: |
          echo "Fetching RSS feeds..."

          # Medium RSS
          curl -s "https://medium.com/feed/@vidyasagarmsc" \
            --max-time 30 -L -o medium_feed.xml || echo "<rss></rss>" > medium_feed.xml

          # VMacWrites WordPress RSS
          curl -s "https://vmacwrites.wordpress.com/feed/" \
            --max-time 30 -L -o vmacwrites_feed.xml || echo "<rss></rss>" > vmacwrites_feed.xml

          # Substack RSS
          curl -s "https://vidyasagarmsc.substack.com/feed" \
            --max-time 30 -L -o substack_feed.xml || echo "<rss></rss>" > substack_feed.xml

          # Hackernoon RSS
          curl -s "https://hackernoon.com/u/vidyasagarmsc/rss" \
            --max-time 30 -L -o hackernoon_feed.xml || echo "<rss></rss>" > hackernoon_feed.xml

          # DZone RSS (user feed)
          curl -s "https://dzone.com/users/vidyasagarmsc/articles.rss" \
            --max-time 30 -L -o dzone_feed.xml || echo "<rss></rss>" > dzone_feed.xml

          echo "All RSS feeds fetched."

      - name: Web scraping for latest profile information
        continue-on-error: true
        run: |
          echo "Fetching latest information about Vidyasagar Machupalli from web sources..."
          
          # Scrape LinkedIn public profile (no API key needed)
          curl -s -L "https://www.linkedin.com/in/vidyasagarmsc" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --max-time 30 -o linkedin_page.html || echo "" > linkedin_page.html
          
          # Scrape DZone profile page for bio and stats
          curl -s -L "https://dzone.com/users/vidyasagarmsc" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --max-time 30 -o dzone_profile.html || echo "" > dzone_profile.html
          
          # Scrape Dev.to profile
          curl -s -L "https://dev.to/vidyasagarmsc" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --max-time 30 -o devto_profile.html || echo "" > devto_profile.html
          
          # Search for recent mentions and achievements
          curl -s -L "https://www.google.com/search?q=vidyasagar+machupalli+IBM+architect" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --max-time 30 -o google_search.html || echo "" > google_search.html
          
          echo "Web scraping completed."

      - name: Fetch additional platform stats
        continue-on-error: true
        run: |
          echo "Fetching additional platform statistics..."
          
          # Fetch Medium stats (followers, etc.)
          curl -s "https://medium.com/@vidyasagarmsc?format=json" \
            --max-time 30 -L -o medium_stats.json || echo "{}" > medium_stats.json
          
          # Fetch GitHub extended stats
          curl -s "https://api.github.com/users/vidyasagarmsc" \
            -H "Accept: application/vnd.github.v3+json" \
            --max-time 30 -o github_stats.json || echo "{}" > github_stats.json
          
          echo "Additional stats fetched."

      - name: Parse and merge all articles
        run: |
          node << 'EOF'
          (async () => {
          const fs = require('fs');
          const { XMLParser } = require('fast-xml-parser');

          // Try to require fast-xml-parser, fallback to manual regex parsing
          let parser;
          try {
            const { XMLParser: FXP } = require('fast-xml-parser');
            parser = new FXP({ ignoreAttributes: false, parseTagValue: true });
          } catch {
            // Inline minimal parser if not available - use regex
            parser = null;
          }

          function parseRSSWithRegex(xml, platform, baseUrl) {
            const items = [];
            const itemRegex = /<item>([\s\S]*?)<\/item>/gi;
            let match;
            while ((match = itemRegex.exec(xml)) !== null) {
              const block = match[1];
              const title = extractTag(block, 'title');
              const link = extractTag(block, 'link') || extractTag(block, 'guid');
              const pubDate = extractTag(block, 'pubDate') || extractTag(block, 'published') || extractTag(block, 'dc:date');
              if (title && link) {
                items.push({ title: cleanCDATA(title), url: cleanUrl(link), platform, date: pubDate ? formatDate(pubDate) : 'Recent' });
              }
            }
            return items;
          }

          function extractTag(xml, tag) {
            const regex = new RegExp(`<${tag}[^>]*>([\\s\\S]*?)</${tag}>`, 'i');
            const match = xml.match(regex);
            return match ? match[1].trim() : '';
          }

          function cleanCDATA(str) {
            return str.replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1').trim();
          }

          function cleanUrl(str) {
            str = cleanCDATA(str).trim();
            // Extract URL from link if it's an Atom link tag
            const hrefMatch = str.match(/href="([^"]+)"/);
            return hrefMatch ? hrefMatch[1] : str;
          }

          function formatDate(dateStr) {
            try {
              const d = new Date(dateStr);
              if (isNaN(d.getTime())) return 'Recent';
              return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            } catch { return 'Recent'; }
          }

          let allArticles = [];
          let profileUpdates = {};

          // === Web Scraping - Extract Profile Information ===
          
          // Extract from LinkedIn page
          try {
            const linkedinHtml = fs.readFileSync('linkedin_page.html', 'utf8');
            
            // Extract headline/role (look for common LinkedIn patterns)
            const headlineMatch = linkedinHtml.match(/<h2[^>]*class="[^"]*top-card[^"]*"[^>]*>([^<]+)<\/h2>/i) ||
                                 linkedinHtml.match(/<div[^>]*class="[^"]*text-body-medium[^"]*"[^>]*>([^<]+)<\/div>/i);
            if (headlineMatch && headlineMatch[1]) {
              const headline = headlineMatch[1].trim();
              if (headline.length > 10 && headline.length < 200) {
                profileUpdates.role = headline;
                console.log(`✓ Extracted role from LinkedIn: ${headline.substring(0, 50)}...`);
              }
            }
            
            // Extract summary/about section
            const summaryMatch = linkedinHtml.match(/<div[^>]*class="[^"]*about[^"]*"[^>]*>([\s\S]{100,1000}?)<\/div>/i) ||
                                linkedinHtml.match(/<section[^>]*aria-label="About"[^>]*>([\s\S]{100,1000}?)<\/section>/i);
            if (summaryMatch && summaryMatch[1]) {
              const summary = summaryMatch[1].replace(/<[^>]+>/g, '').trim();
              if (summary.length > 50) {
                profileUpdates.summary = summary.substring(0, 500);
                console.log(`✓ Extracted summary from LinkedIn`);
              }
            }
          } catch (e) { console.log('LinkedIn scraping skipped:', e.message); }
          
          // Extract from DZone profile
          try {
            const dzoneHtml = fs.readFileSync('dzone_profile.html', 'utf8');
            
            // Extract bio/description
            const bioMatch = dzoneHtml.match(/<div[^>]*class="[^"]*bio[^"]*"[^>]*>([^<]+)<\/div>/i) ||
                            dzoneHtml.match(/<p[^>]*class="[^"]*description[^"]*"[^>]*>([^<]+)<\/p>/i);
            if (bioMatch && bioMatch[1] && !profileUpdates.summary) {
              const bio = bioMatch[1].trim();
              if (bio.length > 50) {
                profileUpdates.summary = bio.substring(0, 500);
                console.log(`✓ Extracted bio from DZone`);
              }
            }
            
            // Extract article count
            const articleMatch = dzoneHtml.match(/(\d+)\s*articles?/i);
            if (articleMatch && articleMatch[1]) {
              console.log(`✓ DZone articles: ${articleMatch[1]}`);
            }
          } catch (e) { console.log('DZone scraping skipped:', e.message); }
          
          // Extract from Dev.to profile
          try {
            const devtoHtml = fs.readFileSync('devto_profile.html', 'utf8');
            
            // Extract follower count
            const followerMatch = devtoHtml.match(/(\d+(?:,\d+)?)\s*followers?/i);
            if (followerMatch && followerMatch[1]) {
              const followers = parseInt(followerMatch[1].replace(/,/g, ''));
              console.log(`✓ Dev.to followers: ${followers}`);
              profileUpdates.devtoFollowers = followers;
            }
            
            // Extract post count
            const postMatch = devtoHtml.match(/(\d+)\s*posts?\s*published/i);
            if (postMatch && postMatch[1]) {
              console.log(`✓ Dev.to posts: ${postMatch[1]}`);
            }
          } catch (e) { console.log('Dev.to scraping skipped:', e.message); }

          // === GitHub Extended Stats ===
          try {
            const githubRaw = fs.readFileSync('github_stats.json', 'utf8');
            const githubData = JSON.parse(githubRaw);
            if (githubData && githubData.followers) {
              console.log(`✓ GitHub followers: ${githubData.followers}`);
            }
            if (githubData && githubData.public_repos) {
              profileUpdates.githubRepos = githubData.public_repos;
              console.log(`✓ GitHub repos: ${githubData.public_repos}`);
            }
          } catch (e) { console.log('GitHub stats parse error:', e.message); }

          // === Medium Stats ===
          try {
            const mediumRaw = fs.readFileSync('medium_stats.json', 'utf8');
            // Medium returns JSON with ")]}while(1);</x>" prefix
            const cleanJson = mediumRaw.replace(/^\)\]\}while\(1\);<x>/, '');
            const mediumData = JSON.parse(cleanJson);
            if (mediumData && mediumData.payload && mediumData.payload.user) {
              const followers = mediumData.payload.user.followerCount;
              if (followers) {
                console.log(`✓ Medium followers: ${followers}`);
              }
            }
          } catch (e) { console.log('Medium stats parse skipped:', e.message); }

          // === Dev.to API ===
          try {
            const devtoRaw = fs.readFileSync('devto_articles.json', 'utf8');
            const devtoArticles = JSON.parse(devtoRaw);
            if (Array.isArray(devtoArticles)) {
              const formatted = devtoArticles.slice(0, 6).map(a => ({
                title: a.title,
                platform: 'Dev.to',
                date: formatDate(a.published_at),
                url: a.url,
                timestamp: new Date(a.published_at).getTime()
              }));
              allArticles = allArticles.concat(formatted);
              console.log(`Dev.to: ${formatted.length} articles`);
            }
          } catch (e) { console.log('Dev.to parse error:', e.message); }

          // === RSS feeds map ===
          const rssFeeds = [
            { file: 'medium_feed.xml', platform: 'Medium' },
            { file: 'vmacwrites_feed.xml', platform: 'VMacWrites' },
            { file: 'substack_feed.xml', platform: 'Substack' },
            { file: 'hackernoon_feed.xml', platform: 'Hackernoon' },
            { file: 'dzone_feed.xml', platform: 'DZone' },
          ];

          for (const feed of rssFeeds) {
            try {
              const xml = fs.readFileSync(feed.file, 'utf8');
              const items = parseRSSWithRegex(xml, feed.platform, '').slice(0, 4);
              // Add approximate timestamps by parsing date strings
              const withTs = items.map(item => ({
                ...item,
                timestamp: (() => {
                  try { return new Date(item.date).getTime() || 0; } catch { return 0; }
                })()
              }));
              allArticles = allArticles.concat(withTs);
              console.log(`${feed.platform}: ${items.length} articles`);
            } catch (e) { console.log(`${feed.platform} parse error:`, e.message); }
          }

          // Deduplicate by URL and Title, sorting by date descending
          const seenUrl = new Set();
          const seenTitle = new Set();
          const unique = allArticles
            .filter(a => {
              if (!a.url || !a.title) return false;
              const cleanTitle = a.title.toLowerCase().replace(/[^a-z0-9]/g, '');
              if (seenUrl.has(a.url) || seenTitle.has(cleanTitle)) return false;
              
              seenUrl.add(a.url);
              seenTitle.add(cleanTitle);
              return true;
            })
            .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

          // Take top 8 articles across all platforms
          const top = unique.slice(0, 8).map(({ title, platform, date, url }) => ({ title, platform, date, url }));

          if (top.length === 0) {
            console.log('No articles found — skipping portfolio update.');
            process.exit(0);
          }

          console.log(`\nTop ${top.length} articles after merging:`);
          top.forEach((a, i) => console.log(`  ${i+1}. [${a.platform}] ${a.title.slice(0, 60)}... (${a.date})`));

          // Read current portfolio data
          const portfolioPath = 'src/data/portfolio.ts';
          let portfolioContent = fs.readFileSync(portfolioPath, 'utf8');

          // Update profile information if available
          if (profileUpdates.role) {
            portfolioContent = portfolioContent.replace(
              /role:\s*"[^"]*"/,
              `role: "${profileUpdates.role}"`
            );
            console.log('✓ Updated role from LinkedIn');
          }

          if (profileUpdates.summary) {
            portfolioContent = portfolioContent.replace(
              /summary:\s*"[^"]*"/,
              `summary: "${profileUpdates.summary}"`
            );
            console.log('✓ Updated summary from LinkedIn');
          }

          // Build new featured array string with proper TypeScript formatting
          const formatArticle = (a) => {
            return `      {\n        title: ${JSON.stringify(a.title)},\n        platform: ${JSON.stringify(a.platform)},\n        date: ${JSON.stringify(a.date)},\n        url: ${JSON.stringify(a.url)}\n      }`;
          };
          
          const articlesFormatted = top.map(formatArticle).join(',\n');
          const newFeatured = `featured: [\n${articlesFormatted}\n    ]`;

          // Replace featured section using a more robust regex
          // This matches "featured: [" followed by any content until "]" that's followed by newline and whitespace and "}"
          const featuredRegex = /featured:\s*\[[\s\S]*?\n\s*\](?=\s*\n\s*\},?\s*\n)/;
          let updatedContent = portfolioContent.replace(
            featuredRegex,
            newFeatured
          );

          // Fetch GitHub Stats and other platform data
          const https = require('https');
          
          // Function to fetch URL with retries
          function fetchWithRetry(url, headers, retries = 3) {
            return new Promise((resolve, reject) => {
              const attempt = (n) => {
                https.get(url, { headers, timeout: 10000 }, (res) => {
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => resolve({ data, statusCode: res.statusCode }));
                }).on('error', (e) => {
                  if (n > 0) {
                    console.log(`Retry ${4-n}/3 for ${url}`);
                    setTimeout(() => attempt(n - 1), 2000);
                  } else {
                    reject(e);
                  }
                });
              };
              attempt(retries);
            });
          }

          // Async function to handle all fetches and file writing
          async function updateStats() {
            const fetchPromises = [];

            // Fetch GitHub stats
            fetchPromises.push(
              fetchWithRetry('https://api.github.com/users/vidyasagarmsc', { 'User-Agent': 'NodeJS' })
                .then(({ data }) => {
                  const ghData = JSON.parse(data);
                  if (ghData && ghData.public_repos) {
                    const newStats = `stats: {\n    githubRepos: ${ghData.public_repos},\n    readers: 550\n                  }`;
                    updatedContent = updatedContent.replace(/stats:\s*\{[\s\S]*?\n\s*\}/, newStats);
                    console.log(`✓ Updated GitHub repos: ${ghData.public_repos}`);
                  }
                })
                .catch(e => console.log('GitHub fetch error:', e.message))
            );

            // Fetch Dev.to follower count
            fetchPromises.push(
              fetchWithRetry('https://dev.to/api/users/by_username?url=vidyasagarmsc', { 'User-Agent': 'NodeJS' })
                .then(({ data }) => {
                  const devtoData = JSON.parse(data);
                  if (devtoData && devtoData.followers_count) {
                    const followers = devtoData.followers_count;
                    console.log(`✓ Dev.to followers: ${followers}`);
                    const devtoRegex = /{\s*name:\s*"Dev\.to"[\s\S]*?stats:\s*\{[^}]*\}/;
                    const match = updatedContent.match(devtoRegex);
                    if (match) {
                      const updated = match[0].replace(
                        /followers:\s*"[^"]*"/,
                        `followers: "${(followers/1000).toFixed(1)}K"`
                      );
                      updatedContent = updatedContent.replace(match[0], updated);
                    }
                  }
                })
                .catch(e => console.log('Dev.to fetch error:', e.message))
            );

            // Fetch DZone profile stats
            fetchPromises.push(
              fetchWithRetry('https://dzone.com/users/vidyasagarmsc.json', { 'User-Agent': 'NodeJS' })
                .then(({ data, statusCode }) => {
                  if (statusCode === 200) {
                    try {
                      const dzoneData = JSON.parse(data);
                      if (dzoneData && dzoneData.articles_count) {
                        console.log(`✓ DZone articles: ${dzoneData.articles_count}`);
                        const dzoneRegex = /{\s*name:\s*"DZone"[\s\S]*?stats:\s*\{[^}]*\}/;
                        const match = updatedContent.match(dzoneRegex);
                        if (match) {
                          const updated = match[0].replace(
                            /posts:\s*"[^"]*"/,
                            `posts: "${dzoneData.articles_count}"`
                          );
                          updatedContent = updatedContent.replace(match[0], updated);
                        }
                      }
                    } catch(e) { console.log('DZone parse error:', e.message); }
                  }
                })
                .catch(e => console.log('DZone fetch skipped'))
            );

            // Wait for all fetches to complete before writing
            await Promise.all(fetchPromises);
            
            if (updatedContent === portfolioContent) {
              console.log('\nNo updates required — portfolio unchanged.');
            } else {
              fs.writeFileSync(portfolioPath, updatedContent);
              console.log('\n✓ Portfolio updated successfully with latest data!');
            }
          }

          await updateStats();
          })();
          EOF

      - name: Cleanup temp files
        run: |
          rm -f devto_articles.json medium_feed.xml vmacwrites_feed.xml \
                substack_feed.xml hackernoon_feed.xml dzone_feed.xml \
                linkedin_page.html dzone_profile.html devto_profile.html \
                google_search.html medium_stats.json github_stats.json

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet src/data/portfolio.ts || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Build verification
        if: steps.git-check.outputs.changes == 'true'
        run: npm run build

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/portfolio.ts
          git commit -m "chore: auto-update articles dataset ⚡️"
          
          # Push the changes. Removing skip-ci so that standard Vercel/NextJS deployments actually trigger!
          git push origin HEAD
